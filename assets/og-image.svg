<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0d121f"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="ambient" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.18)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#ambient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Logo & Wordmark -->
  <g transform="translate(80, 80)">
    <!-- Symbol -->
    <rect width="56" height="56" rx="14" fill="#0d1527" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <path d="M28 14L14 21L28 28L42 21L28 14Z" fill="#3b82f6"/>
    <path d="M14 33L28 40L42 33" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 27L28 34L42 27" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wordmark -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">bit3<tspan fill="#3b82f6">labs</tspan></text>
    <rect x="230" y="16" width="130" height="26" rx="13" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <text x="295" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" letter-spacing="1px">SYSTEMS STUDIO</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 240)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5px">
      Systems Engineering for
    </text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#blueGlow)" letter-spacing="-1.5px">
      High-Growth Digital Products.
    </text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.2px">
      Bespoke Web Applications • Native iOS &amp; Android Apps • Enterprise ERP Architectures
    </text>
  </g>

  <!-- Capability Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="54" rx="12" fill="#0c1220" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="26" cy="27" r="6" fill="#3b82f6"/>
      <text x="44" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Web Applications</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="54" rx="12" fill="#0c1220" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="26" cy="27" r="6" fill="#10b981"/>
      <text x="44" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Mobile Suites</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(460, 0)">
      <rect width="220" height="54" rx="12" fill="#0c1220" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="26" cy="27" r="6" fill="#8b5cf6"/>
      <text x="44" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Custom ERP Systems</text>
    </g>
  </g>

  <!-- Domain Metric Callout -->
  <g transform="translate(930, 485)">
    <text x="190" y="15" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748b" letter-spacing="0.5px">ARCHITECTURAL STANDARD</text>
    <text x="190" y="42" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38bdf8" letter-spacing="-0.5px">Zero-Dependency</text>
  </g>
</svg>
